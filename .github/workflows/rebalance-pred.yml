name: ETF Rebalance Prediction

# 00919、0050、0051、0056、00929 換股預估：抓公開資料（證交所、櫃買中心、公開資訊觀測站），照原試算表算法每天重算。
# 財報季每天都有公司新公布財報，所以每天都重抓 OpenAPI 最新一季並重算。
# 歷史資料（行情約 25 個月、本益比 5 年、財報 6 年、除權息 7 年）第一次要分幾次排程慢慢補齊（每家來源有限速，
# 遇到流量限制就停，下次接著補），補齊前預估頁會顯示「資料補齊中」。
on:
  schedule:
    - cron: '50 13 * * 1-5'   # 21:50 台灣時間：當日行情、當沖、OpenAPI 財報都已更新
    - cron: '20 1 * * 2-6'    # 09:20 台灣時間：補前一晚被限流沒抓完的、凌晨才更新的財報
  workflow_dispatch:
    inputs:
      minutes:
        description: '抓取時間上限（分鐘）；首次補歷史資料可以設大一點'
        default: '40'

permissions:
  contents: write

concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Fetch public data
        run: python3 scripts/fetch_rebalance.py --minutes ${{ github.event.inputs.minutes || '40' }}
        env:
          JSS_DATA_DIR: ./data

      - name: Build predictions
        run: python3 scripts/build_rebalance_pred.py
        env:
          JSS_DATA_DIR: ./data

      - name: Commit and push data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/rebalance/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: rebalance prediction $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          echo "::error::Gave up pushing data after 5 attempts"
          exit 1
