name: Deploy Scheduler

# 把 workers/scheduler（準時排程）部署到 Cloudflare Workers，並設定觸發 GitHub workflow 用的金鑰 DISPATCH_TOKEN
on:
  push:
    branches: [main]
    paths: ['workers/scheduler/**', '.github/workflows/deploy-scheduler.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Deploy worker
        working-directory: workers/scheduler
        run: npx --yes wrangler@3.114.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set DISPATCH_TOKEN
        working-directory: workers/scheduler
        run: printf '%s' "$DISPATCH_TOKEN" | npx --yes wrangler@3.114.0 secret put DISPATCH_TOKEN
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
