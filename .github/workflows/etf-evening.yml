name: ETF Evening Summary

# ETF 持股變化摘要：週一到週五 20:00（台灣時間）LINE 推播。
# 19:40 啟動、先重抓一次 ETF 持股（約 5 分鐘），算好後等到 20:00 才發；另排 20:10 當備援。
# 發過的持股日期記在 data/notify/etf-sent.json，同一份持股不會重複發；超過 22:30 就不發。
on:
  schedule:
    - cron: '40 11 * * 1-5'   # 19:40 台灣時間
    - cron: '10 12 * * 1-5'   # 20:10 備援
  workflow_dispatch:
    inputs:
      preview:
        description: '立刻發一張預覽（不記錄已發送）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: etf-evening
  cancel-in-progress: false

env:
  SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}   # 推播裡的網站連結；放 secrets 的話 Actions 紀錄會自動遮住

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests openpyxl pdfplumber
      - name: Fetch ETF holdings
        run: timeout 20m python3 scripts/fetch_etf.py
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
      - name: Build data views
        run: TZ=Asia/Taipei python3 scripts/build_views.py > /dev/null
      - name: Send ETF summary at 20:00
        run: TZ=Asia/Taipei python3 scripts/notify.py --etf-alert ${{ inputs.preview && '--preview' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      - name: Save data and sent state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/etf/ data/notify/
          git diff --staged --quiet && exit 0
          git commit -m "data: etf holdings + summary $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          exit 1
