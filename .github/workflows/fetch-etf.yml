name: ETF Holdings Fetch

on:
  schedule:
    # GitHub 排程常延後好幾小時或跳過，所以多排幾次；每次都是增量抓取。
    - cron: '20 13 * * 1-5'   # 21:20 台灣時間：多數投信已公布當日持股
    - cron: '52 15 * * 1-5'   # 23:52：補漏
    - cron: '5 0 * * 2-6'     # 08:05 台灣時間：補抓較晚公布的投信（國泰等）
    - cron: '35 3 * * 2-6'    # 11:35：再補一次
  workflow_dispatch:

permissions:
  contents: write

# 兩個抓取 workflow 共用同一組，排隊依序執行，不會同時推送
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl pdfplumber

      - name: Fetch market holiday calendar
        run: python3 scripts/fetch_calendar.py
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch ETF holdings, AUM and prices
        run: python3 scripts/fetch_etf.py
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch ETF holdings history (rebalance durations)
        run: python3 scripts/fetch_etf_history.py --minutes 15
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch index review schedule
        run: python3 scripts/fetch_index_schedule.py
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch broker branch trades
        run: python3 scripts/fetch_broker.py
        env:
          JSS_DATA_DIR: ./data

      # 行情／融資券、三大法人、期貨、可轉債由 Daily Stock Data Fetch 負責，這裡不重抓，避免兩邊同時推送衝突
      - name: Fetch TDCC holders
        run: python3 scripts/fetch_holders.py --weeks 12 --top 300 --minutes 8 || true
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch insider shareholding changes
        run: python3 scripts/fetch_insider.py --minutes 15
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data

      - name: Commit and push data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/etf/ data/broker/ data/insider/ data/holders/
          git add data/calendar.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: etf holdings $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          echo "::error::Gave up pushing data after 5 attempts"
          exit 1
