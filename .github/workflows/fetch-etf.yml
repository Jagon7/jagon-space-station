name: ETF Holdings Fetch

on:
  schedule:
    - cron: '20 13 * * 1-5'   # 21:20 台灣時間：多數投信已公布當日持股
    - cron: '5 0 * * 2-6'     # 08:05 台灣時間：補抓較晚公布的投信（國泰等）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-etf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl pdfplumber

      - name: Fetch ETF holdings, AUM and prices
        run: python3 scripts/fetch_etf.py
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch index review schedule
        run: python3 scripts/fetch_index_schedule.py
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch CB timeline
        run: python3 scripts/fetch_cb.py
        env:
          JSS_DATA_DIR: ./data

      - name: Commit and push data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/etf/ data/cb/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: etf holdings $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
            git pull --rebase origin main
          done
          echo "::error::Gave up pushing data after 5 attempts"
          exit 1
