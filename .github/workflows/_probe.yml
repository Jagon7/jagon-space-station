name: probe-calendar (temporary)
on:
  push:
    branches: [claude/youthful-rubin-xo17ci]
    paths: [.github/workflows/_probe.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          pip install requests >/dev/null
          curl -s https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule | head -c 1500; echo
          JSS_DATA_DIR=/tmp/d python3 scripts/fetch_calendar.py && cat /tmp/d/calendar.json
