name: probe-mops (temporary)
on:
  push:
    branches: [claude/youthful-rubin-xo17ci]
    paths: [scripts/_probe_mops.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install requests && python3 scripts/_probe_mops.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f probe_out && git commit -m "probe output" && git push
