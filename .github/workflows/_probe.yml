name: probe-mops (temporary)
on:
  push:
    branches: [claude/youthful-rubin-xo17ci]
    paths: [scripts/_probe_mops.py]
permissions:
  contents: write
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - run: pip install requests && python3 scripts/fetch_insider.py --minutes 95 --shard ${{ matrix.k }}/8 --only-company
      - uses: actions/upload-artifact@v4
        with:
          name: ins-${{ matrix.k }}
          path: data/insider
  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - run: |
          pip install requests
          python3 scripts/_merge_insider.py shards/*
          python3 scripts/fetch_insider.py --minutes 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/insider && git commit -qm "insider backfill (parallel)" && git pull --rebase -q && git push
