name: backfill-daily (temporary)
on:
  push:
    branches: [claude/youthful-rubin-xo17ci]
    paths: [.github/workflows/_probe.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: pip install requests >/dev/null && python3 scripts/fetch_market_daily.py --days 130 --minutes 90
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/daily && git commit -qm "daily market data backfill" && git pull --rebase -q && git push
