name: _probe
on: { push: { branches: [claude/youthful-rubin-xo17ci] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: |
          cd scripts && python3 -c "
          import fetch_intel as f
          d={}
          f.fetch_fred(d); f.fetch_us(d, f.RISK_TICKERS, '2y')
          print({k:(len(v), v[-1]) for k,v in d.items()})"
        env: { JSS_DATA_DIR: ../data }
