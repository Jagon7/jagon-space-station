name: _probe
on:
  push:
    branches: [claude/youthful-rubin-xo17ci]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" -e "https://mopsov.twse.com.tw/mops/web/index" \
            -d "encodeURIComponent=1&step=1&firstin=1&off=1&isQuery=Y&TYPEK=sii&year=115&month=10" \
            "https://mopsov.twse.com.tw/mops/web/ajax_t100sb02_1" -o c.html
          grep -o '<form[^>]*fm_fileDownload[^>]*>' c.html | head -2
          grep -o 'name=.fm_fileDownload.[^>]*' c.html | head -2
          for u in "https://mopsov.twse.com.tw/nas/STR/233020261015M001.pdf" "https://mops.twse.com.tw/nas/STR/233020261015M001.pdf"; do
            curl -s -A "Mozilla/5.0" -o /dev/null -w "%{http_code} %{content_type} %{size_download} $u\n" "$u"; done
