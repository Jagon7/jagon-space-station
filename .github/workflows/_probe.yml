name: backfill-holders (temporary)
on:
  push:
    branches: [claude/youthful-rubin-xo17ci]
    paths: [.github/workflows/_probe.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v7
      - run: pip install requests >/dev/null && python3 scripts/fetch_holders.py --weeks 12 --top 300 --minutes 105
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/holders && git commit -qm "holders backfill" && git pull --rebase -q && git push
