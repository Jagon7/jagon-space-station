name: Daily Stock Data Fetch

on:
  # GitHub 排程常延後 5～7 小時、偶爾整次跳過，所以一天排好幾次；
  # 每次都是增量抓取（已有的日期不重抓），重跑只會補上缺的資料。時間皆避開整點。
  schedule:
    - cron: '47 7 * * 1-5'    # 15:47 台灣時間：收盤行情、漲停、成交排行
    - cron: '17 10 * * 1-5'   # 18:17：三大法人、注意／處置、期貨
    - cron: '37 13 * * 1-5'   # 21:37：融資融券、借券
    - cron: '43 15 * * 1-5'   # 23:43：補漏
    - cron: '13 2 * * 6'      # 週六 10:13：補週五漏掉的、月營收／季報
  workflow_dispatch:        # 可手動觸發

# 兩個抓取 workflow 共用同一組，排隊依序執行，不會同時推送
concurrency:
  group: data-fetch
  cancel-in-progress: false

permissions:
  contents: write

env:
  SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}   # 推播裡的網站連結；放 secrets 的話 Actions 紀錄會自動遮住

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright
        run: python3 -m playwright install chromium --with-deps

      - name: Fetch stock data
        id: fetch
        run: python3 scripts/fetch_data.py
        env:
          JSS_DATA_DIR: ./data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Fetch CB timeline
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: python3 scripts/fetch_cb.py
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch industry chain (Mondays)
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: |
          if [ "$(TZ=Asia/Taipei date +%u)" = "1" ] || [ ! -f data/industry/chain.json ]; then
            python3 scripts/fetch_industry.py
          fi
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch turnover ranking
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: python3 scripts/fetch_ranking.py
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch fundamentals (revenue, income, self-reported earnings, buyback, events)
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: python3 scripts/fetch_fundamentals.py --minutes 15
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch institutional investors and futures
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: |
          python3 scripts/fetch_institutional.py --days 10 --minutes 8 || true
          python3 scripts/fetch_futures.py --months 2 || true
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch disposition history (for swing strategies)
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: python3 scripts/fetch_strategy.py --days 60 || true
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch daily market data (quotes, margin, SBL)
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: python3 scripts/fetch_market_daily.py --days 10 --minutes 10
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data

      - name: Ex-dividend fade backtest (Saturdays)
        if: always() && steps.fetch.conclusion != 'cancelled' && github.event.schedule == '13 2 * * 6'
        continue-on-error: true
        timeout-minutes: 20
        run: python3 scripts/backtest_exdiv.py --cache /tmp/yahoo --hq
        env:
          JSS_DATA_DIR: ./data

      - name: Commit and push data
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          echo "::error::Gave up pushing data after 5 attempts"
          exit 1
