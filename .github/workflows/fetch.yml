name: Daily Stock Data Fetch

on:
  schedule:
    - cron: '0 11 * * *'   # 19:00 CST (UTC+8) = 11:00 UTC
  workflow_dispatch:        # 可手動觸發

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright
        run: python3 -m playwright install chromium --with-deps

      - name: Fetch stock data
        id: fetch
        run: python3 scripts/fetch_data.py
        env:
          JSS_DATA_DIR: ./data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Fetch CB timeline
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: python3 scripts/fetch_cb.py
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch industry chain (Mondays)
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: |
          if [ "$(TZ=Asia/Taipei date +%u)" = "1" ] || [ ! -f data/industry/chain.json ]; then
            python3 scripts/fetch_industry.py
          fi
        env:
          JSS_DATA_DIR: ./data

      - name: Fetch turnover ranking
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: python3 scripts/fetch_ranking.py
        env:
          JSS_DATA_DIR: ./data

      - name: Commit and push data
        if: always() && steps.fetch.conclusion != 'cancelled'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
            git pull --rebase origin main
          done
          echo "::error::Gave up pushing data after 5 attempts"
          exit 1
