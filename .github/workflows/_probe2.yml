name: probe-insider-quick (temporary)
on:
  push:
    branches: [claude/youthful-rubin-xo17ci]
    paths: [.github/workflows/_probe2.yml]
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          pip install requests
          JSS_DATA_DIR=/tmp/d python3 scripts/fetch_insider.py --months 1 --minutes 3 9999
          ls /tmp/d/insider/transfer | wc -l
          python3 -c "
          import json,glob
          fs=sorted(glob.glob('/tmp/d/insider/transfer/*.json'))
          print(fs[0],fs[-1]); n=0
          for f in fs: n+=len(json.load(open(f)))
          print('rows',n); print(json.load(open(fs[-2]))[:3])
          "
          ls /tmp/d/insider/px | wc -l
