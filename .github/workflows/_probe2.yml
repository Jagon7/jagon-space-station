name: probe-insider-quick (temporary)
on:
  push:
    branches: [claude/youthful-rubin-xo17ci]
    paths: [.github/workflows/_probe2.yml]
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import re, requests
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0 Safari/537.36"
          for rep in ["SY", "OY"]:
              form = {"step": "2", "year": "115", "month": "10", "day": "08", "report": rep, "firstin": "true"}
              r = requests.post("https://mopsov.twse.com.tw/mops/web/ajax_t56sb12", data=form, headers={"User-Agent": UA, "Referer": "https://mopsov.twse.com.tw/mops/web/t56sb12_q1"}, timeout=60)
              t = r.content.decode("utf-8", errors="replace")
              t = re.sub(r"<script.*?</script>", "", t, flags=re.S)
              t = re.sub(r"\s+", " ", t)
              print("=====", rep, r.status_code, len(t), t.count("<tr"))
              i = t.find("<table")
              print(t[i:i+6000])
          PY
          python3 p.py
