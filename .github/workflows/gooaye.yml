name: Gooaye Episode Alert

# 股癌每集重點：RSS 有新的一集就下載音檔 → faster-whisper 轉文字（約 10 分鐘）→ AI 整理重點與個股（Claude → 免費的 Gemini → 都沒有就列出逐字稿提到的個股）→ LINE。
# 通常週三、週六 14:40～16:15 上架；Cloudflare 排程在週三、週六 16:00、17:30、21:00 檢查，另外每天 22:30 檢查一次（特別集）。
# 沒有新集數幾秒就結束；發過的集數記在 data/notify/gooaye-sent.json，重點存在 data/gooaye/。
on:
  schedule:
    - cron: '0 8 * * 3,6'     # 16:00 台灣時間（備援，主要由 Cloudflare 觸發）
    - cron: '0 13 * * 3,6'    # 21:00 備援
  workflow_dispatch:
    inputs:
      preview:
        description: '重做最新一集並發預覽（不記錄已發送）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gooaye
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests faster-whisper anthropic imageio-ffmpeg
      - name: Restore whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Restore transcript cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/gooaye
          key: gooaye-tx-${{ github.run_id }}
          restore-keys: gooaye-tx-
      - name: Summarize latest episode and send
        run: TZ=Asia/Taipei python3 -u scripts/gooaye.py ${{ inputs.preview && '--preview' || '' }}
        env:
          JSS_DATA_DIR: ./data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      - name: Save transcript cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/gooaye
          key: gooaye-tx-${{ github.run_id }}
      - name: Save summary and sent state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/gooaye/ data/notify/ 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "data: gooaye $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          exit 1
