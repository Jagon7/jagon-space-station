name: Research Data

# 研究用資料下載（手動觸發）：抄底個股研究（證交所歷史行情與籌碼）、新高法回測要用的三大法人
on:
  workflow_dispatch:
    inputs:
      job:
        description: "rebound＝抄底個股；t86＝新高法三大法人（data/research/new_high_need.json 的日期）；revenue＝月營收歷史（2011 起）；dtstop＝當沖停損研究的盤中 K 線（永豐）；market＝大盤成交金額與融資餘額歷史；dthist＝個股當沖歷史（2014 起）；futhist＝期交所法人期貨／選擇權籌碼歷史（2020 起）"
        type: choice
        options: [rebound, t86, revenue, dtstop, market, dthist, futhist]
        default: rebound

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests ${{ inputs.job == 'dtstop' && 'shioaji==1.7.9' || '' }}
      - name: Rebound stock data (TWSE)
        if: inputs.job == 'rebound'
        run: python3 -u scripts/fetch_rebound_data.py
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
      - name: New-high strategy institutional flow (TWSE T86)
        if: inputs.job == 't86'
        run: python3 -u scripts/fetch_t86_hist.py
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
          T86_MAX_SEC: "18000"
      - name: Monthly revenue history (MOPS)
        if: inputs.job == 'revenue'
        run: python3 -u scripts/fetch_revenue_hist.py
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
      - name: Market turnover and margin history (TWSE / TPEx)
        if: inputs.job == 'market'
        run: python3 -u scripts/fetch_market_hist.py
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
      - name: Day-trade history (TWSE TWTB4U / TPEx, 2014+)
        if: inputs.job == 'dthist'
        run: python3 -u scripts/fetch_dt_hist.py --minutes 300
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
      - name: TAIFEX institutional futures / options history (2020+)
        if: inputs.job == 'futhist'
        run: python3 -u scripts/fetch_futures_hist.py --minutes 300
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
      - name: Day-trade stop-loss intraday bars (Shioaji, quote only)
        if: inputs.job == 'dtstop'
        # 永豐登入訊息會印出登入識別碼（身分證字號格式），公開的 Actions log 一律遮掉
        run: |
          set -o pipefail
          python3 -u scripts/fetch_dt_stop.py --minutes 300 2>&1 | sed -u -E 's/[A-Z][12][0-9]{8}/[已遮蔽]/g'
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
      - name: Commit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          rm -f shioaji.log
          for f in data/research/rebound data/research/new_high_inst.json data/research/revenue_hist.json data/research/revenue_sample_*.html data/research/dt_stop_bars.json.gz data/research/market_hist.json data/research/dt_hist data/research/futures_hist.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --staged --quiet && exit 0
          git commit -m "data: research ${{ inputs.job }}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          exit 1
