name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 資料抓取 workflow 用 GITHUB_TOKEN 推送，不會觸發 push 事件，所以改在它們跑完後重建
  workflow_run:
    workflows: ["Daily Stock Data Fetch", "ETF Holdings Fetch"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build   # prebuild 會先跑 scripts/build_views.py
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          TZ: Asia/Taipei

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
