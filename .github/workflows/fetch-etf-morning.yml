name: Morning ETF PCF Re-fetch

on:
  schedule:
    - cron: '30 23 * * *'   # 07:30 CST (UTC+8) = 23:30 UTC, 開盤前
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright
        run: python3 -m playwright install chromium --with-deps

      - name: Re-fetch ETF PCF data
        run: python3 scripts/fetch_data.py --etf-only
        env:
          JSS_DATA_DIR: ./data

      - name: Commit and push data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/etf-flow.json data/etf-pcf-prev.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: etf morning refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
            git pull --rebase origin main
          done
          echo "::error::Gave up pushing data after 5 attempts"
          exit 1
