name: TX Regime Signal

# 台指期當日型態（BO／MR）即時訊號：09:15 用前 30 分鐘 1 分 K 判斷，推 LINE（永豐只查行情、不下單）
on:
  schedule:
    - cron: '5 1 * * 1-5'    # 09:05 台灣時間（啟動後等到 09:15:25 才判斷）
  workflow_dispatch:
    inputs:
      now:
        description: 'true＝不等 09:15，直接用目前資料'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: tx-regime
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install shioaji==1.7.9 requests
      - name: Signal at 09:15
        # 永豐登入訊息會印出登入識別碼（身分證字號格式），公開的 Actions log 一律遮掉
        run: |
          set -o pipefail
          TZ=Asia/Taipei python3 -u scripts/tx_regime_live.py ${{ inputs.now == 'true' && '--now' || '' }} 2>&1 | sed -u -E 's/[A-Z][12][0-9]{8}/[已遮蔽]/g'
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
          JSS_DATA_DIR: ./data
      - name: Save sent state
        if: always()
        run: |
          rm -f shioaji.log
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -e data/notify/tx-regime-sent.json ] && git add data/notify/tx-regime-sent.json
          git diff --staged --quiet && exit 0
          git commit -m "notify: tx regime signal sent"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          exit 1
