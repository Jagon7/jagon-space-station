name: Settlement Update

# 結算策略每日更新（Cloudflare 排程 21:40 觸發，晚上 10 點前網頁要是當天的，含當天當沖比）：
#   期交所大額交易人＋結算價 → 當沖（有公布就抓）→ 永豐 1 分 K 整日平均折溢價 → 提交 → 部署網站
# 21:50／22:05 由 Data Freshness（only=結算）檢查網站上的 settlement.json 是不是當天：不是就再跑一次這個 workflow，22:05 還不是才發 LINE。
on:
  schedule:
    - cron: '45 13 * * 1-5'   # 21:45 台灣時間（備援；主要由 Cloudflare 21:40 觸發）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: settlement
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install shioaji==1.7.9 requests
      - name: TAIFEX large traders and settlement prices
        run: python3 -u scripts/fetch_settlement.py --days 10
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
      - name: Day-trade volume (if already published)
        run: |
          python3 -u - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import fetch_strategy as fs
          p = fs.OUT / "daytrade.json"
          try:
              known = json.loads(p.read_text(encoding="utf-8")).get("days", {})
          except (OSError, ValueError):
              known = {}
          dt = fs.daytrade(known)
          if dt:
              p.write_text(json.dumps({"updatedAt": fs.datetime.now(fs.TPE).isoformat(timespec="minutes"), "days": dt}, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              print("當沖：最新", max(d for d, v in dt.items() if v.get("tw") or v.get("tp")))
          PY
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
      - name: Full-day average basis (Shioaji 1-min bars, quotes only)
        # 永豐登入訊息會印出登入識別碼（身分證字號格式），公開的 Actions log 一律遮掉
        run: |
          set -o pipefail
          python3 -u scripts/settlement_basis.py 2>&1 | sed -u -E 's/[A-Z][12][0-9]{8}/[已遮蔽]/g'
        continue-on-error: true
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          JSS_DATA_DIR: ./data
      - name: LINE push (Friday the week before settlement)
        # 每月結算前一週的週五晚上推控盤排行；其他日子程式自己會略過。當沖還沒到會等 21:50 那次重跑，22:00 後就不等了
        run: |
          mkdir -p public/data
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from pathlib import Path; import build_settlement as b; b.build(Path('data'), Path('public/data'))"
          TZ=Asia/Taipei python3 scripts/notify.py --settlement-alert
        continue-on-error: true
        env:
          JSS_DATA_DIR: ./data
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit
        id: commit
        run: |
          rm -f shioaji.log
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for f in data/settlement data/strategy/daytrade.json data/notify/settlement-sent.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --staged --quiet && exit 0
          git commit -m "data: settlement $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          exit 1
      - name: Deploy site
        # 不管有沒有新資料都重建一次，確保網頁上的結算表是最新的
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
