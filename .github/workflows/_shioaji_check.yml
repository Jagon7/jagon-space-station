name: Shioaji Check (temporary)
# 一次性：檢查永豐 API 是否已開通、並跑開通要求的模擬下單測試；確認後刪除
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install shioaji
      - run: python3 scripts/shioaji_check.py
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          SHIOAJI_TEST_API_KEY: ${{ secrets.SHIOAJI_TEST_API_KEY }}
          SHIOAJI_TEST_SECRET_KEY: ${{ secrets.SHIOAJI_TEST_SECRET_KEY }}
