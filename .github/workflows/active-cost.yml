name: Active ETF Cost

# 主動式 ETF 建倉成本：逐日抓各檔從掛牌起的持股，用股數增減重播平均成本（停損監控用）。
# 第一次要抓一年多的每日持股（約 1～3 小時）；每日原始持股存在 Actions cache，之後每天只補新的日子。
# 更新完就發 LINE「主動ETF停損＋融資斷頭」（週一到五；發過的日期記在 data/notify/active-sent.json）。
on:
  workflow_dispatch:
    inputs:
      preview:
        description: '立刻發一張預覽（不記錄已發送）'
        type: boolean
        default: false
  schedule:
    - cron: '0 14 * * 1-5'   # 22:00 台灣時間（主要由 Cloudflare 觸發）：多數投信已公布當日持股

permissions:
  contents: write

concurrency:
  group: active-cost
  cancel-in-progress: false

jobs:
  cost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests openpyxl pdfplumber
      - name: Restore raw holdings cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/jss-active
          key: active-raw-${{ github.run_id }}
          restore-keys: active-raw-
      - name: Rebuild active ETF cost
        run: python3 -u scripts/active_cost.py --minutes 15  # 歷史已補完，每天只補新的一天；投信網站卡住時最多 15 分鐘就用現有資料算
        env:
          JSS_DATA_DIR: ./data
      - name: Send stop-loss alert
        run: TZ=Asia/Taipei python3 scripts/notify.py --active-alert ${{ inputs.preview && '--preview' || '' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      - name: Save raw holdings cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/jss-active
          key: active-raw-${{ github.run_id }}
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/etf/active_cost.json data/notify/ 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "data: active etf cost $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          exit 1
